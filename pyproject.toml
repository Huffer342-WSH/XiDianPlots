[build-system]
# 确保使用支持 pyproject.toml 配置的 setuptools 版本
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "XiDianPlots"
version = "0.1.1"
description = "Matplotlib style for Xidian University Thesis"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Huffer342-WSH", email = "718007138@qq.com" }]
dependencies = [
    "matplotlib>=3.2.0",
    "PyMuPDF",
    "requests",
]


[tool.setuptools.packages.find]
where = ["."]


[tool.setuptools.package-data]
"XiDianPlots.style" = ["*.mplstyle", "*.ttf"]
